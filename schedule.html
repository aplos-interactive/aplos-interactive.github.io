<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#fdf0f8;
  --ink2:#c9a8c0;
  --ink3:#8a6a82;
  --paper:#0e0b0f;
  --paper2:#13101a;
  --paper3:#1e1828;
  --line:rgba(255,200,230,.07);
  --line2:rgba(255,200,230,.14);
  --pink:#ff8fd4;
  --yellow:#f7e87a;
  --grad:linear-gradient(135deg,#f7e87a,#ffb3e0,#c9a0ff);
  --r:6px;
  --rl:10px;
}

html{scroll-behavior:smooth}
body{
  font-family:'Geist',sans-serif;
  font-weight:400;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding:2.5rem 1.5rem 4rem;
}

/* ── header ── */
header{
  max-width:1300px;
  margin:0 auto 2rem;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:1rem;
  flex-wrap:wrap;
  padding-bottom:1.25rem;
  border-bottom:1px solid var(--line2);
}

.wordmark{
  font-family:'Instrument Serif',serif;
  font-size:32px;
  letter-spacing:-.5px;
  line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.wordmark em{
  font-style:italic;
}
.sub{
  font-size:11px;
  color:var(--ink3);
  margin-top:5px;
  letter-spacing:.02em;
}

.autosave-badge{
  font-size:11px;
  color:var(--ink3);
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:99px;
  border:1px solid var(--line2);
  background:var(--paper2);
  transition:color .3s, border-color .3s;
}
.autosave-badge.saved{color:var(--pink);border-color:rgba(255,143,212,.3)}
.autosave-badge .dot{
  width:6px;height:6px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}

.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:5px;
  height:32px;padding:0 12px;
  font-family:'Geist',sans-serif;font-size:12px;font-weight:500;
  border-radius:var(--r);
  border:1px solid var(--line2);
  background:var(--paper3);color:var(--ink);
  cursor:pointer;white-space:nowrap;
  transition:background .1s,border-color .1s;
}
.btn:hover{background:var(--paper2);border-color:var(--pink)}
.btn:active{transform:scale(.98)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink3)}
.btn-ghost:hover{background:var(--paper2);border-color:var(--line2);color:var(--pink)}

/* ── grid ── */
.schedule-wrap{
  max-width:1300px;
  margin:0 auto;
  background:var(--paper3);
  border:1px solid var(--line2);
  border-radius:var(--rl);
  overflow:hidden;
}

.grid-header{
  display:grid;
  grid-template-columns:48px repeat(7,1fr);
  border-bottom:1px solid var(--line2);
  background:var(--paper2);
}
.ghc{
  padding:9px 6px;
  font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);text-align:center;
  border-right:1px solid var(--line);
}
.ghc:last-child{border-right:none}
.ghc.active{color:var(--ink);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.grid-body{display:grid;grid-template-columns:48px repeat(7,1fr)}

.time-col{
  border-right:1px solid var(--line2);
  position:relative;
  background:var(--paper2);
}
.tick{
  position:absolute;right:7px;
  font-family:'Geist Mono',monospace;font-size:9px;
  color:var(--ink3);transform:translateY(-50%);
  white-space:nowrap;pointer-events:none;
  user-select:none;
}

.day-col{
  border-right:1px solid var(--line);
  position:relative;cursor:crosshair;
}
.day-col:last-child{border-right:none}
.day-col:hover{background:rgba(255,143,212,.02)}

.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hlh{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none;opacity:.5}

/* blocks */
.block{
  position:absolute;left:2px;right:2px;
  border-radius:5px;
  padding:3px 5px;
  cursor:pointer;overflow:hidden;
  border:1px solid rgba(0,0,0,.06);
  transition:filter .12s,box-shadow .12s;
}
.block:hover{filter:brightness(.88);box-shadow:0 2px 12px rgba(255,143,212,.15);z-index:2}
.bt{
  font-family:'Geist Mono',monospace;font-size:8.5px;
  color:rgba(0,0,0,.38);line-height:1;margin-bottom:2px;
}
.bl{font-size:10.5px;font-weight:500;color:rgba(0,0,0,.7);line-height:1.25;overflow:hidden}

/* legend */
.legend{
  max-width:1300px;margin:1rem auto 0;
  display:flex;flex-wrap:wrap;gap:6px 14px;
}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.ld{width:9px;height:9px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.07)}

/* toast */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:linear-gradient(135deg,#f7e87a,#ff8fd4);color:#0e0b0f;
  font-size:12px;padding:8px 14px;
  border-radius:var(--r);
  opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;z-index:9999;
}
.toast.show{opacity:1;transform:none}

/* modal & overlay styling */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(4px);
  z-index:1000;align-items:center;justify-content:center;
}
.overlay.open{display:flex}

.modal{
  background:var(--paper2);
  border-radius:var(--rl);
  border:1px solid var(--line2);
  padding:1.5rem;width:340px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:pop .15s ease;
}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}

.modal-title{
  font-family:'Instrument Serif',serif;
  font-size:22px;margin-bottom:1.25rem;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}

.field{margin-bottom:14px}
.field label{
  display:block;font-size:10.5px;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:5px;
}
.field input,.field select{
  width:100%;height:36px;
  border-radius:var(--r);border:1px solid var(--line2);
  padding:0 10px;font-family:'Geist',sans-serif;font-size:13px;
  background:var(--paper3);color:var(--ink);outline:none;
  transition:border-color .12s;
}
.field input:focus,.field select:focus{border-color:var(--pink)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.copt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.cswatch{
  width:30px;height:20px;border-radius:4px;
  border:2px solid transparent;
  transition:border-color .1s,transform .1s;
}
.cswatch:hover{transform:scale(1.08)}
.cswatch.sel{border-color:var(--pink)}
.cname{font-size:7.5px;color:var(--ink3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36px}

.mactions{display:flex;gap:6px;margin-top:1.25rem}
.mactions .btn{flex:1;justify-content:center}
.btn-del{background:rgba(255,80,80,.1);color:#ff6b6b;border-color:rgba(255,80,80,.2)}
.btn-del:hover{background:rgba(255,80,80,.18)}
.btn-save{background:var(--grad);background:linear-gradient(135deg,#f7e87a,#ff8fd4);color:#0e0b0f;border:none;font-weight:600}
.btn-save:hover{opacity:.85}

/* Custom Auth Form Additions */
.auth-subtitle{
  font-size:11px;
  color:var(--ink3);
  margin-top:-10px;
  margin-bottom:1.25rem;
  line-height:1.4;
}
.user-badge-display {
  background:var(--paper3);
  border:1px solid var(--line2);
  border-radius:var(--r);
  padding:12px;
  margin-bottom:1rem;
  text-align:center;
}
.user-badge-display .username-headline {
  font-size:18px;
  font-weight:500;
  color:var(--pink);
}
.user-badge-display .status-subtext {
  font-size:11px;
  color:var(--ink3);
  margin-top:2px;
}
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Weekly <em>Schedule</em></div>
    <div class="sub">Click any block to edit &middot; Click empty space to add &middot; Changes save automatically</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="autosave-badge" id="save-badge" onclick="handleAccountAction()" style="cursor: pointer;">
      <div class="dot"></div>
      <span id="save-text">Saved</span>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost" onclick="clearStorage()" title="Reset to default">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.87"/></svg>
        Reset
      </button>
    </div>
  </div>
</header>

<div class="schedule-wrap">
  <div class="grid-header" id="ghdr"></div>
  <div class="grid-body" id="gbody"></div>
</div>
<div class="legend" id="legend"></div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" onclick="handleOverlay(event)">
  <div class="modal" id="modal"></div>
</div>

function toMins(h,m){return(h-START_H)*60+m}
function fmtTime(t){const a=t+START_H*60,hr=Math.floor(a/60)%24,m=a%60,s=hr<12?'AM':'PM',hh=hr===0?12:hr>12?hr-12:hr;return m===0?`${hh} ${s}`:`${hh}:${String(m).padStart(2,'0')} ${s}`}
function toHM(t){const a=t+START_H*60;return{h:Math.floor(a/60),m:a%60}}
function fromHM(h,m){return toMins(h,m)}

// ── localStorage & Supabase Sync ──
function loadSchedule(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const d=JSON.parse(raw);if(d&&d.length===7)return d}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
}

let saveTimer=null;
function saveSchedule(){
  const badge=document.getElementById('save-badge');
  const txt=document.getElementById('save-text');
  badge.classList.remove('saved');
  txt.textContent='Saving…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{
      localStorage.setItem(LS_KEY,JSON.stringify(schedule));
      
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        await supabaseClient
          .from('schedules')
          .upsert({ id: user.id, schedule_data: schedule, updated_at: new Date() });
      }
      
      badge.classList.add('saved');
      txt.textContent=user ? 'Saved to Cloud' : 'Saved';
    }catch(e){
      txt.textContent='Save failed';
    }
  },600);
}

function clearStorage(){
  if(!confirm('Reset to the original schedule? This cannot be undone.'))return;
  localStorage.removeItem(LS_KEY);
  schedule=JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  render();
  saveSchedule();
  toast('Schedule reset');
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

let schedule=loadSchedule();

// ── Custom In-App Modal Login Interface ──
async function handleAccountAction() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  
// Locate this section inside your handleAccountAction() function:
if (user) {
  const cleanUsername = user.email.split('@')[0];
  
  // Updated template with fixed Close button

async function processSignOut() {
  closeModal();
  await supabaseClient.auth.signOut();
  toast("Signed out successfully");
}

async function submitAuthForm() {
  const userField = document.getElementById('auth-user');
  const passField = document.getElementById('auth-pass');
  const submitBtn = document.getElementById('auth-submit-btn');

  const username = userField.value.trim();
  const password = passField.value;

  if (!username || !password) {
    toast("Please enter both fields");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Connecting…";

  const internalEmail = `${username.toLowerCase()}@local.app`;

  // 1. Try logging in
  const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({ 
    email: internalEmail, 
    password: password 
  });
  
  if (signInError) {
    // 2. Account doesn't exist yet, sign up instantly
    if (signInError.message.includes("Invalid login credentials") || signInError.message.includes("User not found")) {
      const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ 
        email: internalEmail, 
        password: password 
      });
      
      if (signUpError) {
        alert("Authentication failed: " + signUpError.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Sync Now";
      } else {
        toast("Account created successfully!");
        closeModal();
        setTimeout(() => { saveSchedule(); }, 1000);
      }
    } else {
      alert("Authentication failed: " + signInError.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Sync Now";
    }
  } else {
    toast("Welcome back!");
    closeModal();
  }
}

// Global Auth Watcher Configuration
supabaseClient.auth.onAuthStateChange(async (event, session) => {
  const badge = document.getElementById('save-badge');
  if (session && session.user) {
    const cleanUsername = session.user.email.split('@')[0];
    badge.title = `Logged in as "${cleanUsername}". Click to view Profile / Logout.`;
    badge.style.cursor = 'pointer';
    
    try {
      const { data, error } = await supabaseClient
        .from('schedules')
        .select('schedule_data')
        .eq('id', session.user.id)
        .maybeSingle();
        
      if (data && data.schedule_data) {
        schedule = data.schedule_data;
        localStorage.setItem(LS_KEY, JSON.stringify(schedule));
        render();
        toast("Loaded cloud schedule!");
      } else {
        saveSchedule();
      }
    } catch(e) { console.error("Cloud sync mismatch", e); }
  } else {
    badge.title = "Click to Create Account / Login to Sync Devices";
    badge.style.cursor = 'pointer';
    document.getElementById('save-text').textContent = 'Offline Mode (Click to Sync)';
  }
});

// ── render ──
function render(){renderHeader();renderBody();renderLegend()}

function renderHeader(){
  document.getElementById('ghdr').innerHTML=
    `<div class="ghc"></div>`+
    DAYS.map(d=>`<div class="ghc active">${d}</div>`).join('');
}

function renderBody(){
  const el=document.getElementById('gbody');
  el.innerHTML='';

  const tc=document.createElement('div');
  tc.className='time-col';tc.style.height=colPx()+'px';
  for(let h=Math.ceil(START_H);h<=END_H;h++){
    const pct=toMins(h,0)/TOTAL_MINS;
    if(pct<0||pct>1)continue;
    const t=document.createElement('div');t.className='tick';
    t.style.top=(pct*colPx())+'px';
    const hr2=h%24,s=hr2<12?'AM':'PM',hh=hr2===0?12:hr2>12?hr2-12:hr2;
    t.textContent=`${hh}${s}`;
    tc.appendChild(t);
  }
  el.appendChild(tc);

  schedule.forEach((day,di)=>{
    const col=document.createElement('div');
    col.className='day-col';col.style.height=colPx()+'px';

    for(let h=Math.ceil(START_H);h<=END_H;h++){
      const pct=toMins(h,0)/TOTAL_MINS;
      if(pct<0||pct>1)continue;
      const l=document.createElement('div');l.className='hl';l.style.top=(pct*colPx())+'px';col.appendChild(l);
      const hp=toMins(h,30)/TOTAL_MINS;
      if(hp>=0&&hp<=1){const lh=document.createElement('div');lh.className='hlh';lh.style.top=(hp*colPx())+'px';col.appendChild(lh)}
    }

    col.addEventListener('click',e=>{
      if(e.target!==col)return;
      const r=col.getBoundingClientRect();
      const mins=Math.round(((e.clientY-r.top)/colPx())*TOTAL_MINS/15)*15;
      openModal(di,null,mins);
    });

    day.forEach((b,bi)=>{
      const top=(b.start/TOTAL_MINS)*colPx();
      const h=((b.end-b.start)/TOTAL_MINS)*colPx();
      const el2=document.createElement('div');
      el2.className='block';
      el2.style.cssText=`top:${top}px;height:${Math.max(h,18)}px;background:${COLORS[b.color]||'#E0E0E0'}`;
      el2.innerHTML=`<div class="bt">${fmtTime(b.start)}</div>${h>18?`<div class="bl">${b.label}</div>`:''}`;
      el2.addEventListener('click',e=>{e.stopPropagation();openModal(di,bi)});
      col.appendChild(el2);
    });
    el.appendChild(col);
  });
}

function renderLegend(){
  const used=new Set();schedule.flat().forEach(b=>used.add(b.color));
  document.getElementById('legend').innerHTML=[...used].map(c=>
    `<div class="li"><div class="ld" style="background:${COLORS[c]||'#E0E0E0'}"></div>${c}</div>`
  ).join('');
}

// ── modal ──
let _day=null,_bi=null;

function openModal(di,bi,ds){
  _day=di;_bi=bi;
  const isNew=bi===null;
  const b=isNew?{start:ds||0,end:(ds||0)+60,label:'',color:'Other'}:{...schedule[di][bi]};
  const sh=toHM(b.start),eh=toHM(b.end),p=n=>String(n).padStart(2,'0');

  document.getElementById('modal').innerHTML=`
    <div class="modal-title">${isNew?'Add activity':'Edit activity'}</div>
    <div class="field">
      <label>Name</label>
      <input id="ml" value="${b.label}" placeholder="e.g. Soccer practice">
    </div>
    <div class="field trow">
      <div><label>Start</label><input id="ms" type="time" value="${p(sh.h)}:${p(sh.m)}"></div>
      <div><label>End</label><input id="me" type="time" value="${p(eh.h)}:${p(eh.m)}"></div>
    </div>
    <div class="field">
      <label>Day</label>
      <select id="md">${DAYS.map((d,i)=>`<option value="${i}"${i===di?' selected':''}>${d}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>Colour</label>
      <div class="cgrid">${Object.entries(COLORS).map(([n,hex])=>`
        <div class="copt" onclick="pickCol('${n}',this)" data-color="${n}">
          <div class="cswatch${n===b.color?' sel':''}" style="background:${hex}"></div>
          <div class="cname">${n}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="mactions">
      ${!isNew?`<button class="btn btn-del" onclick="delBlock()">Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveBlock()">Save</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('ml').focus(),50);
}

function pickCol(name,el){
  document.querySelectorAll('.cswatch').forEach(s=>s.classList.remove('sel'));
  el.querySelector('.cswatch').classList.add('sel');
}

function saveBlock(){
  const label=document.getElementById('ml').value.trim();
  const sv=document.getElementById('ms').value,ev=document.getElementById('me').value;
  const nd=parseInt(document.getElementById('md').value);
  const sel=document.querySelector('.cswatch.sel');
  const color=sel?sel.closest('[data-color]').dataset.color:'Other';
  if(!label||!sv||!ev){toast('Fill in all fields');return}
  const[sh,sm]=sv.split(':').map(Number),[eh,em]=ev.split(':').map(Number);
  const start=fromHM(sh,sm),end=fromHM(eh,em);
  if(end<=start){toast('End must be after start');return}
  const nb={start,end,label,color};
  if(_bi===null){schedule[nd].push(nb)}
  else if(nd!==_day){schedule[_day].splice(_bi,1);schedule[nd].push(nb)}
  else{schedule[_day][_bi]=nb}
  schedule.forEach(d=>d.sort((a,b)=>a.start-b.start));
  closeModal();render();saveSchedule();
}

function delBlock(){
  if(!confirm('Delete this activity?'))return;
  schedule[_day].splice(_bi,1);
  closeModal();render();saveSchedule();
}

function closeModal(){document.getElementById('overlay').classList.remove('open')}
function handleOverlay(e){if(e.target===document.getElementById('overlay'))closeModal()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();
document.getElementById('save-badge').classList.add('saved');
</script>
</body>
</html>
