<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Weekly Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: rgba(0,0,0,0.09);
  --border-strong: rgba(0,0,0,0.15);
  --text: #1a1916;
  --text-muted: #8a8880;
  --text-faint: #b8b6b0;
  --accent: #1a1916;
  --radius: 8px;
  --radius-lg: 12px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1.5rem;
}

header {
  max-width: 1200px;
  margin: 0 auto 1.5rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.title-block h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: var(--text);
}

.week-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s, transform 0.08s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--text); color: #fff; border-color: var(--text); }
.btn-primary:hover { background: #333; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.schedule-wrap {
  max-width: 1200px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
}

.grid-header {
  display: grid;
  grid-template-columns: 52px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
}

.grid-header-cell {
  padding: 10px 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: center;
  border-right: 1px solid var(--border);
}
.grid-header-cell:last-child { border-right: none; }
.grid-header-cell.day { color: var(--text); }

.grid-body {
  display: grid;
  grid-template-columns: 52px repeat(7, 1fr);
}

.time-col {
  border-right: 1px solid var(--border);
  position: relative;
  background: var(--surface);
}

.time-tick {
  position: absolute;
  right: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  transform: translateY(-50%);
  white-space: nowrap;
  pointer-events: none;
}

.day-col {
  border-right: 1px solid var(--border);
  position: relative;
  cursor: crosshair;
}
.day-col:last-child { border-right: none; }

.h-line {
  position: absolute; left: 0; right: 0;
  border-top: 1px solid var(--border);
  pointer-events: none;
}
.h-line-half {
  position: absolute; left: 0; right: 0;
  border-top: 1px dashed var(--border);
  pointer-events: none; opacity: 0.6;
}

.block {
  position: absolute;
  left: 3px; right: 3px;
  border-radius: 6px;
  padding: 4px 6px;
  cursor: pointer;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.07);
  transition: filter 0.1s, transform 0.1s;
}
.block:hover { filter: brightness(0.92); transform: scale(1.01); z-index: 2; }
.block-time {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(0,0,0,0.4);
  line-height: 1;
  margin-bottom: 2px;
}
.block-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(0,0,0,0.72);
  line-height: 1.25;
  overflow: hidden;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(2px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-strong);
  padding: 1.5rem;
  width: 340px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  animation: pop 0.15s ease;
}
@keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.field input, .field select {
  width: 100%;
  height: 36px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  padding: 0 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.12s;
}
.field input:focus, .field select:focus { border-color: var(--text); }

.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.color-opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}
.color-swatch {
  width: 32px; height: 22px;
  border-radius: 4px;
  border: 2px solid transparent;
  transition: border-color 0.1s, transform 0.1s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.sel { border-color: var(--text); }
.color-name { font-size: 8px; color: var(--text-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40px; }

.modal-actions {
  display: flex; gap: 8px; margin-top: 1.25rem;
}
.modal-actions .btn { flex: 1; justify-content: center; }
.btn-danger { background: #fff0f0; color: #c0392b; border-color: #f5c6c6; }
.btn-danger:hover { background: #ffe0e0; }

.legend {
  max-width: 1200px;
  margin: 1rem auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.08);
  flex-shrink: 0;
}

.hint {
  max-width: 1200px;
  margin: 0.75rem auto 0;
  font-size: 12px;
  color: var(--text-faint);
}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Weekly Schedule</h1>
    <div class="week-label">Click any block to edit &middot; Click empty space to add</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="exportJSON()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export JSON
    </button>
    <button class="btn" onclick="document.getElementById('file-in').click()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import JSON
    </button>
    <input type="file" id="file-in" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
</header>

<div class="schedule-wrap">
  <div class="grid-header" id="grid-header"></div>
  <div class="grid-body" id="grid-body"></div>
</div>

<div class="legend" id="legend"></div>
<p class="hint">Tip: Export your schedule as JSON to save it, then import it next time you open the page.</p>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const START_H = 7.75; // 7:45 AM
const END_H = 22;     // 10:00 PM
const TOTAL_MINS = (END_H - START_H) * 60;
const COL_PX = 640;

const COLORS = {
  'School':    '#C8E6C9',
  'Soccer':    '#FFD180',
  'Tutoring':  '#F8BBD0',
  'Textbook':  '#B3E5FC',
  'Homework':  '#FFE0B2',
  'Training':  '#FFCDD2',
  'Chores':    '#D7CCC8',
  'Meals':     '#FFF9C4',
  'Snack':     '#F0F4C3',
  'Free Time': '#F3E5F5',
  'Shower':    '#B2EBF2',
  'Science':   '#CE93D8',
  'Personal':  '#EDE7F6',
  'Commute':   '#CFD8DC',
  'Other':     '#E0E0E0',
};

function toMins(h, m) { return (h - START_H) * 60 + m; }
function fmtTime(totalMins) {
  const absM = totalMins + START_H * 60;
  const h = Math.floor(absM / 60);
  const m = absM % 60;
  const suffix = h < 12 ? 'AM' : 'PM';
  const hh = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return m === 0 ? `${hh} ${suffix}` : `${hh}:${String(m).padStart(2,'0')} ${suffix}`;
}
function toHM(mins) {
  const absM = mins + START_H * 60;
  return { h: Math.floor(absM / 60), m: absM % 60 };
}
function fromHM(h, m) { return toMins(h, m); }

let schedule = [
  [ // Monday
    {start:0,   end:90,  label:'Wake Up & Breakfast',      color:'Meals'},
    {start:90,  end:465, label:'School',                   color:'School'},
    {start:465, end:525, label:'Tutoring',                 color:'Tutoring'},
    {start:525, end:585, label:'Textbook Study',           color:'Textbook'},
    {start:585, end:680, label:'Free Time',                color:'Free Time'},
    {start:680, end:720, label:'Commute to Soccer',        color:'Commute'},
    {start:720, end:795, label:'Soccer',                   color:'Soccer'},
    {start:795, end:835, label:'Commute Home',             color:'Commute'},
    {start:835, end:855, label:'Shower & Wind Down',       color:'Shower'},
  ],
  [ // Tuesday
    {start:0,   end:90,  label:'Wake Up & Breakfast',      color:'Meals'},
    {start:90,  end:465, label:'School',                   color:'School'},
    {start:465, end:525, label:'Snack & Free Time',        color:'Snack'},
    {start:525, end:585, label:'Training',                 color:'Training'},
    {start:585, end:645, label:'Textbook Study',           color:'Textbook'},
    {start:645, end:720, label:'Chores',                   color:'Chores'},
    {start:720, end:750, label:'Homework',                 color:'Homework'},
    {start:750, end:795, label:'Dinner',                   color:'Meals'},
    {start:795, end:855, label:'Wind Down',                color:'Personal'},
  ],
  [ // Wednesday
    {start:0,   end:90,  label:'Wake Up & Breakfast',      color:'Meals'},
    {start:90,  end:465, label:'School',                   color:'School'},
    {start:465, end:525, label:'Tutoring',                 color:'Tutoring'},
    {start:525, end:585, label:'Textbook Study',           color:'Textbook'},
    {start:585, end:605, label:'Free Time',                color:'Free Time'},
    {start:605, end:645, label:'Commute to Soccer',        color:'Commute'},
    {start:645, end:720, label:'Soccer',                   color:'Soccer'},
    {start:720, end:760, label:'Commute Home',             color:'Commute'},
    {start:760, end:790, label:'Shower',                   color:'Shower'},
    {start:790, end:855, label:'Dinner & Wind Down',       color:'Meals'},
  ],
  [ // Thursday
    {start:0,   end:90,  label:'Wake Up & Breakfast',      color:'Meals'},
    {start:90,  end:465, label:'School',                   color:'School'},
    {start:465, end:525, label:'Snack & Free Time',        color:'Snack'},
    {start:525, end:585, label:'Training',                 color:'Training'},
    {start:585, end:645, label:'Textbook Study',           color:'Textbook'},
    {start:645, end:720, label:'Chores',                   color:'Chores'},
    {start:720, end:750, label:'Homework',                 color:'Homework'},
    {start:750, end:795, label:'Dinner',                   color:'Meals'},
    {start:795, end:855, label:'Wind Down',                color:'Personal'},
  ],
  [ // Friday
    {start:0,   end:90,  label:'Wake Up & Breakfast',      color:'Meals'},
    {start:90,  end:465, label:'School',                   color:'School'},
    {start:465, end:525, label:'Snack & Free Time',        color:'Snack'},
    {start:525, end:585, label:'Training',                 color:'Training'},
    {start:585, end:645, label:'Textbook Study',           color:'Textbook'},
    {start:645, end:720, label:'Chores',                   color:'Chores'},
    {start:720, end:780, label:'Dinner',                   color:'Meals'},
    {start:780, end:855, label:'Free Time / Social',       color:'Free Time'},
  ],
  [ // Saturday
    {start:75,  end:135, label:'Wake Up & Breakfast',      color:'Meals'},
    {start:135, end:195, label:'Textbook Study',           color:'Textbook'},
    {start:195, end:255, label:'Chores',                   color:'Chores'},
    {start:255, end:315, label:'Lunch',                    color:'Meals'},
    {start:315, end:405, label:'Training',                 color:'Training'},
    {start:405, end:555, label:'Free Time / Social',       color:'Free Time'},
    {start:555, end:615, label:'Dinner',                   color:'Meals'},
    {start:615, end:855, label:'Evening Free',             color:'Free Time'},
  ],
  [ // Sunday
    {start:75,  end:135, label:'Wake Up & Breakfast',      color:'Meals'},
    {start:135, end:195, label:'Chores & Family',          color:'Chores'},
    {start:195, end:255, label:'Family Time',              color:'Personal'},
    {start:255, end:315, label:'Lunch',                    color:'Meals'},
    {start:315, end:375, label:'Textbook Study',           color:'Textbook'},
    {start:375, end:435, label:'Science',                  color:'Science'},
    {start:435, end:555, label:'Meal Prep & Plan Week',    color:'Personal'},
    {start:555, end:615, label:'Dinner',                   color:'Meals'},
    {start:615, end:855, label:'Evening Free',             color:'Free Time'},
  ],
];

function render() {
  renderHeader();
  renderBody();
  renderLegend();
}

function renderHeader() {
  const el = document.getElementById('grid-header');
  el.innerHTML = `<div class="grid-header-cell"></div>` +
    DAYS.map(d => `<div class="grid-header-cell day">${d}</div>`).join('');
}

function renderBody() {
  const el = document.getElementById('grid-body');
  el.innerHTML = '';

  const timeCol = document.createElement('div');
  timeCol.className = 'time-col';
  timeCol.style.height = COL_PX + 'px';

  for (let h = Math.ceil(START_H); h <= END_H; h++) {
    const mins = toMins(h, 0);
    const pct = mins / TOTAL_MINS;
    if (pct < 0 || pct > 1) continue;
    const tick = document.createElement('div');
    tick.className = 'time-tick';
    tick.style.top = (pct * COL_PX) + 'px';
    const suffix = h < 12 ? 'AM' : 'PM';
    const hh = h > 12 ? h - 12 : h;
    tick.textContent = `${hh} ${suffix}`;
    timeCol.appendChild(tick);
  }
  el.appendChild(timeCol);

  schedule.forEach((daySched, di) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.style.height = COL_PX + 'px';

    for (let h = Math.ceil(START_H); h <= END_H; h++) {
      const mins = toMins(h, 0);
      const pct = mins / TOTAL_MINS;
      if (pct < 0 || pct > 1) continue;
      const line = document.createElement('div');
      line.className = 'h-line';
      line.style.top = (pct * COL_PX) + 'px';
      col.appendChild(line);
      const hm = toMins(h, 30);
      const hp = hm / TOTAL_MINS;
      if (hp >= 0 && hp <= 1) {
        const hl = document.createElement('div');
        hl.className = 'h-line-half';
        hl.style.top = (hp * COL_PX) + 'px';
        col.appendChild(hl);
      }
    }

    col.addEventListener('click', e => {
      if (e.target !== col) return;
      const rect = col.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const mins = Math.round((y / COL_PX) * TOTAL_MINS / 15) * 15;
      openModal(di, null, mins);
    });

    daySched.forEach((block, bi) => {
      const topPx = (block.start / TOTAL_MINS) * COL_PX;
      const heightPx = ((block.end - block.start) / TOTAL_MINS) * COL_PX;
      const el2 = document.createElement('div');
      el2.className = 'block';
      el2.style.top = topPx + 'px';
      el2.style.height = Math.max(heightPx, 20) + 'px';
      el2.style.background = COLORS[block.color] || '#E0E0E0';
      el2.innerHTML = `
        <div class="block-time">${fmtTime(block.start)}</div>
        ${heightPx > 20 ? `<div class="block-label">${block.label}</div>` : ''}
      `;
      el2.addEventListener('click', e => { e.stopPropagation(); openModal(di, bi); });
      col.appendChild(el2);
    });

    el.appendChild(col);
  });
}

function renderLegend() {
  const el = document.getElementById('legend');
  const used = new Set();
  schedule.flat().forEach(b => used.add(b.color));
  el.innerHTML = [...used].map(c =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${COLORS[c]||'#E0E0E0'}"></div>
      ${c}
    </div>`
  ).join('');
}

let _editDay = null, _editBlock = null;

function openModal(dayIdx, blockIdx, defaultStart) {
  _editDay = dayIdx;
  _editBlock = blockIdx;
  const isNew = blockIdx === null;
  const block = isNew
    ? { start: defaultStart || 0, end: (defaultStart || 0) + 60, label: '', color: 'Other' }
    : { ...schedule[dayIdx][blockIdx] };

  const shm = toHM(block.start);
  const ehm = toHM(block.end);
  const pad = n => String(n).padStart(2,'0');

  document.getElementById('modal').innerHTML = `
    <h2>${isNew ? 'Add activity' : 'Edit activity'}</h2>
    <div class="field">
      <label>Activity name</label>
      <input id="m-label" value="${block.label}" placeholder="e.g. Soccer practice" autofocus>
    </div>
    <div class="field time-row">
      <div>
        <label>Start time</label>
        <input id="m-start" type="time" value="${pad(shm.h)}:${pad(shm.m)}">
      </div>
      <div>
        <label>End time</label>
        <input id="m-end" type="time" value="${pad(ehm.h)}:${pad(ehm.m)}">
      </div>
    </div>
    <div class="field">
      <label>Day</label>
      <select id="m-day">
        ${DAYS.map((d,i) => `<option value="${i}"${i===dayIdx?' selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-grid">
        ${Object.entries(COLORS).map(([name, hex]) => `
          <div class="color-opt" onclick="pickColor('${name}',this)" data-color="${name}">
            <div class="color-swatch${name===block.color?' sel':''}" style="background:${hex}"></div>
            <div class="color-name">${name}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="modal-actions">
      ${!isNew ? `<button class="btn btn-danger" onclick="deleteBlock()">Delete</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBlock()">Save</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('m-label').focus();
}

function pickColor(name, el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('sel'));
  el.querySelector('.color-swatch').classList.add('sel');
}

function saveBlock() {
  const label = document.getElementById('m-label').value.trim();
  const startVal = document.getElementById('m-start').value;
  const endVal = document.getElementById('m-end').value;
  const newDay = parseInt(document.getElementById('m-day').value);
  const selSwatch = document.querySelector('.color-swatch.sel');
  const color = selSwatch ? selSwatch.closest('[data-color]').dataset.color : 'Other';

  if (!label || !startVal || !endVal) { alert('Please fill in all fields.'); return; }
  const [sh, sm] = startVal.split(':').map(Number);
  const [eh, em] = endVal.split(':').map(Number);
  const start = fromHM(sh, sm);
  const end = fromHM(eh, em);
  if (end <= start) { alert('End time must be after start time.'); return; }

  const newBlock = { start, end, label, color };
  const isNew = _editBlock === null;

  if (isNew) {
    schedule[newDay].push(newBlock);
  } else {
    if (newDay !== _editDay) {
      schedule[_editDay].splice(_editBlock, 1);
      schedule[newDay].push(newBlock);
    } else {
      schedule[_editDay][_editBlock] = newBlock;
    }
  }
  schedule.forEach(d => d.sort((a, b) => a.start - b.start));
  closeModal();
  render();
}

function deleteBlock() {
  if (!confirm('Delete this activity?')) return;
  schedule[_editDay].splice(_editBlock, 1);
  closeModal();
  render();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function exportJSON() {
  const data = JSON.stringify({ schedule, version: 1 }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-schedule.json';
  a.click();
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.schedule && data.schedule.length === 7) {
        schedule = data.schedule;
        render();
      } else {
        alert('Invalid schedule file.');
      }
    } catch { alert('Could not read file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

render();
</script>
</body>
</html>
